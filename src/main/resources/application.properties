spring.application.name=crud
# 1. Configuración de conexión a MySQL
# Asegúrate de que 'db_crud' es el nombre exacto de la base de datos que creaste
spring.datasource.url=jdbc:mysql://localhost:3306/db_crud?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Tu usuario (por defecto en XAMPP es root)
spring.datasource.username=root

# 3. Tu contraseña (por defecto en XAMPP es vacía, si tienes una ponla después del =)
spring.datasource.password=

# 4. El Driver (opcional en versiones nuevas, pero ponerlo evita problemas)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. MAGIA JPA: Esto crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update

# 6. Para ver en la consola las consultas SQL que hace Java por detrás (útil para aprender)
spring.jpa.show-sql=true